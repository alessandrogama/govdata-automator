services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govdata_automator_n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    env_file:
      - ./n8n/.env
    environment:
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_RUNNERS_DISABLED=true
      - NODE_PATH=/usr/local/lib/node_modules/n8n/node_modules
      - N8N_PUBLIC_API_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
      - .:/data

  bootstrap:
    image: python:3.11-slim
    container_name: govdata_automator_bootstrap
    depends_on:
      - n8n
    restart: "no"
    volumes:
      - .:/data
      - n8n_data:/home/node/.n8n
    working_dir: /data
    env_file:
      - ./n8n/.env
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
    command: sh -c "pip install requests -q && python python/bootstrap_workflows.py"

volumes:
  n8n_data:
    driver: local
